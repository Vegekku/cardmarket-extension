<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cardmarket Highlighter — Opciones</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="options.css">
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <span class="save-status" id="saveStatus"></span>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-header">
        <img src="icons/icon48.png" alt="">
        <span class="sidebar-title">Cardmarket Highlighter</span>
      </div>
      <button class="tab-btn active" data-tab="appearance" data-i18n="tabAppearance"></button>
      <button class="tab-btn" data-tab="about" data-i18n="tabAbout"></button>
    </nav>

    <main class="content">

      <div class="tab-panel active" id="panel-appearance">
        <h1 data-i18n="h1Appearance"></h1>

        <h2 data-i18n="h2HighlightColor"></h2>
        <div class="row">
          <div>
            <label data-i18n="labelLight"></label>
            <div class="hint" data-i18n="hintLight"></div>
          </div>
          <input type="color" id="colorLight">
        </div>
        <div id="previewLight" class="preview-wrap"></div>

        <div class="row">
          <div>
            <label data-i18n="labelDark"></label>
            <div class="hint" data-i18n="hintDark"></div>
          </div>
          <input type="color" id="colorDark">
        </div>
        <div id="previewDark" class="preview-wrap" data-bs-theme="dark"></div>

        <div class="actions">
          <button id="save" class="btn-primary" disabled data-i18n="btnSave"></button>
          <button id="reset" class="btn-secondary" disabled data-i18n="btnReset"></button>
        </div>
      </div>

      <div class="tab-panel" id="panel-about">
        <h1 data-i18n="h1About"></h1>
        <p class="about-version" id="about-version"></p>
        <div class="about-links">
          <a id="about-store" href="" target="_blank" data-i18n="linkStore"></a>
          <a href="https://github.com/vegekku/cardmarket-extension/blob/main/CHANGELOG.md" target="_blank" data-i18n="linkChangelog"></a>
          <a href="https://github.com/vegekku/cardmarket-extension/issues/new" target="_blank" data-i18n="linkIssues"></a>
          <a id="about-privacy" href="https://vegekku.github.io/cardmarket-extension/privacy.html" target="_blank" data-i18n="linkPrivacy"></a>
        </div>
        <div class="about-support">
          <p data-i18n="supportText"></p>
          <a id="about-donate" href="https://www.paypal.com/donate/?hosted_button_id=GPVK6CD3YM6NL" target="_blank" class="donate-btn" data-i18n="btnDonate"></a>
        </div>
      </div>

    </main>
  </div>

  <script src="options.js"></script>
</body>
</html>
