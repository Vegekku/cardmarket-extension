<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resaltador de usuarios</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <span class="save-status" id="saveStatus"></span>
    <h3 id="popupHeading"></h3>
    <textarea id="terms" placeholder=""></textarea>
    <div class="bottom-row">
        <label class="toggle-label" id="toggleLabel">
            <input type="checkbox" id="enabledToggle">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span id="toggleLabelText"></span>
        </label>
        <button id="clearBtn" class="btn-destructive"></button>
    </div>
    <script src="popup.js"></script>
</body>
</html>
