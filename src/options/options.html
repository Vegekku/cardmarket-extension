<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cardmarket Highlighter — Opciones</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="options.css">
  <link rel="stylesheet" href="preview.css">
  <link rel="stylesheet" href="order-preview.css">
</head>
<body>
  <span class="save-status" id="saveStatus"></span>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-header">
        <img src="icons/icon48.png" alt="">
        <span class="sidebar-title">Cardmarket Highlighter</span>
      </div>
      <button class="tab-btn active" data-tab="appearance" data-i18n="tabAppearance"></button>
      <button class="tab-btn" data-tab="about" data-i18n="tabAbout"></button>
    </nav>

    <main class="content">

      <div class="tab-panel active" id="panel-appearance">
        <h1 data-i18n="h1Appearance"></h1>

        <h2 data-i18n="h2HighlightColor"></h2>
        <div class="row">
          <div>
            <label data-i18n="labelLight"></label>
            <div class="hint" data-i18n="hintLight"></div>
          </div>
          <input type="color" id="colorLight">
        </div>
        <div id="previewLight" class="preview-wrap"></div>

        <div class="row section-start">
          <div>
            <label data-i18n="labelDark"></label>
            <div class="hint" data-i18n="hintDark"></div>
          </div>
          <input type="color" id="colorDark">
        </div>
        <div id="previewDark" class="preview-wrap" data-bs-theme="dark"></div>

        <h2 data-i18n="h2OrderSettings"></h2>

        <div class="row">
          <div>
            <label data-i18n="labelGameBlocksEnabled"></label>
            <div class="hint" data-i18n="hintGameBlocksEnabled"></div>
          </div>
          <label class="toggle-label toggle-right">
            <input type="checkbox" id="gameBlocksEnabled">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>
        <div class="row" id="gameBlocksCollapsedRow" hidden>
          <div>
            <label for="gameBlocksCollapsed" data-i18n="labelGameBlocksCollapsed"></label>
          </div>
          <label class="toggle-label toggle-right">
            <input type="checkbox" id="gameBlocksCollapsed">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>

        <div class="row section-start">
          <div>
            <label data-i18n="labelGameBlocksSubtotalEnabled"></label>
            <div class="hint" data-i18n="hintGameBlocksSubtotalEnabled"></div>
          </div>
          <label class="toggle-label toggle-right">
            <input type="checkbox" id="gameBlocksSubtotalEnabled">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>

        <div class="row section-start">
          <div>
            <label for="checkboxSize" data-i18n="labelCheckboxSize"></label>
            <div class="hint" data-i18n="hintCheckboxSize"></div>
          </div>
          <div class="range-control">
            <input type="range" id="checkboxSize" min="1" max="3" step="0.25">
          </div>
        </div>

        <div class="row section-start">
          <div>
            <label data-i18n="labelCheckedOpacityEnabled"></label>
            <div class="hint" data-i18n="hintCheckedOpacity"></div>
          </div>
          <label class="toggle-label toggle-right">
            <input type="checkbox" id="checkedOpacityEnabled">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>
        <div class="row" id="checkedOpacityRow" hidden>
          <div>
            <label for="checkedOpacity" data-i18n="labelCheckedOpacity"></label>
          </div>
          <div class="range-control">
            <input type="range" id="checkedOpacity" min="0" max="1" step="0.05">
            <span id="checkedOpacityValue"></span>
          </div>
        </div>

        <div class="row section-start">
          <div>
            <label data-i18n="labelInlineImages"></label>
            <div class="hint" data-i18n="hintInlineImages"></div>
          </div>
          <label class="toggle-label toggle-right">
            <input type="checkbox" id="inlineImagesEnabled">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>
        <div class="row" id="inlineImageHeightRow" hidden>
          <div>
            <label for="inlineImageHeight" data-i18n="labelInlineImageHeight"></label>
            <div class="hint" data-i18n="hintInlineImageHeight"></div>
          </div>
          <div class="range-control">
            <input type="range" id="inlineImageHeight" min="24" max="96" step="8">
            <span id="inlineImageHeightValue"></span>
          </div>
        </div>

        <h2 data-i18n="h2OrderPreview"></h2>
        <div id="orderPreviewWrap" class="order-preview-wrap"></div>

        <div class="actions">
          <button id="save" class="btn-primary" disabled data-i18n="btnSave"></button>
          <button id="reset" class="btn-secondary" disabled data-i18n="btnReset"></button>
        </div>
      </div>

      <div class="tab-panel" id="panel-about">
        <h1 data-i18n="h1About"></h1>
        <p class="about-version" id="about-version"></p>
        <div class="about-links">
          <a id="about-store" href="https://chromewebstore.google.com/detail/cardmarket-highlighter/jmekahcibjcoemagbbkmnjjhlofolomc" target="_blank" data-i18n="linkStore"></a>
          <a href="https://github.com/vegekku/cardmarket-extension/blob/main/CHANGELOG.md" target="_blank" data-i18n="linkChangelog"></a>
          <a href="https://github.com/vegekku/cardmarket-extension/issues/new" target="_blank" data-i18n="linkIssues"></a>
          <a id="about-privacy" href="https://vegekku.github.io/cardmarket-extension/privacy.html" target="_blank" data-i18n="linkPrivacy"></a>
        </div>
        <div class="about-support">
          <p data-i18n="supportText"></p>
          <a id="about-donate" href="https://www.paypal.com/donate/?hosted_button_id=GPVK6CD3YM6NL" target="_blank" class="donate-btn" data-i18n="btnDonate"></a>
        </div>
      </div>

    </main>
  </div>

  <script src="options.js"></script>
</body>
</html>
