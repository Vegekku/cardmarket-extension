<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback – Cardmarket Highlighter</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; color: #333; line-height: 1.6; }
    h1 { font-size: 1.4em; margin-bottom: 8px; }
    p.subtitle { color: #666; font-size: 0.9em; margin-top: 0; margin-bottom: 28px; }
    label { display: block; font-size: 0.9em; font-weight: 600; margin-bottom: 4px; }
    select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9em; font-family: inherit; box-sizing: border-box; }
    textarea { resize: vertical; min-height: 100px; }
    .field { margin-bottom: 18px; }
    .hint { font-size: 0.8em; color: #999; margin-top: 3px; }
    button[type=submit] { background: #004a8f; color: #fff; border: none; border-radius: 4px; padding: 9px 22px; font-size: 0.9em; cursor: pointer; }
    button[type=submit]:hover { background: #003d78; }
    button[type=submit]:disabled { background: #aaa; cursor: default; }
    #status { margin-top: 16px; font-size: 0.9em; }
    #status.ok { color: #2a7a2a; }
    #status.err { color: #c0392b; }
  </style>
</head>
<body>
  <h1>Feedback – Cardmarket Highlighter</h1>
  <p class="subtitle">¿Encontraste un bug o tienes una sugerencia? Cuéntanos.</p>

  <form id="feedbackForm">
    <!-- Honeypot: los bots lo rellenan, los humanos no -->
    <input type="text" name="website" style="display:none" tabindex="-1" autocomplete="off">

    <div class="field">
      <label for="type">Tipo de feedback</label>
      <select id="type" name="type" required>
        <option value="" disabled selected>Selecciona una opción</option>
        <option value="bug">Bug</option>
        <option value="suggestion">Sugerencia</option>
        <option value="question">Pregunta</option>
        <option value="other">Otro</option>
      </select>
    </div>

    <div class="field">
      <label for="description">Descripción</label>
      <textarea id="description" name="description" required placeholder="Describe el problema o sugerencia con el mayor detalle posible..."></textarea>
    </div>

    <div class="field">
      <label for="url">URL de la página (opcional)</label>
      <input type="url" id="url" name="url" placeholder="https://www.cardmarket.com/..." style="width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:4px;font-size:0.9em;box-sizing:border-box;">
      <div class="hint">La página de Cardmarket donde ocurrió el problema, si aplica.</div>
    </div>

    <button type="submit">Enviar</button>
    <p id="status"></p>
  </form>

  <script>
    const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzpGpGPRg9qfgYoRO33knwPPL0uJTzq5BipviGcIRQeqloyyn2nQ_zVQw-Xi1dfZ1Z2/exec';

    const params = new URLSearchParams(location.search);
    const meta = {
      version: params.get('version') || '',
      browser: params.get('browser') || '',
      lang:    params.get('lang')    || '',
      theme:   params.get('theme')   || '',
    };

    document.getElementById('feedbackForm').addEventListener('submit', async e => {
      e.preventDefault();
      const form = e.target;
      const submitBtn = form.querySelector('button[type=submit]');
      const status = document.getElementById('status');

      // Honeypot check
      if (form.website.value) return;

      submitBtn.disabled = true;
      status.className = '';
      status.textContent = 'Enviando...';

      try {
        await fetch(ENDPOINT, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({
            type:        form.type.value,
            description: form.description.value,
            url:         form.url.value,
            version:     meta.version,
            browser:     meta.browser,
            lang:        meta.lang,
            theme:       meta.theme,
          }),
        });
        status.className = 'ok';
        status.textContent = '¡Gracias! Tu feedback ha sido enviado.';
        form.reset();
      } catch {
        status.className = 'err';
        status.textContent = 'Error al enviar. Inténtalo de nuevo.';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
